name: 🚚 Sync Data Contracts to GCS

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'bigquery/clinical/synthea/bronze/ingestion_configs/**'
      - '.github/workflows/sync_contracts.yml'

jobs:
  sync_contracts:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------
      # 1. Select TARGET PROJECT + TARGET BUCKET
      # ---------------------------------------------------
      - name: Determine Environment Bucket
        id: env_vars
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "TARGET_PROJECT=prj-lbd-shared-pd" >> $GITHUB_ENV
            echo "TARGET_BUCKET=bkt-clin-syn-configs-pd" >> $GITHUB_ENV
            echo "TARGET_SA=project-service-account@prj-lbd-shared-pd.iam.gserviceaccount.com" >> $GITHUB_ENV
          else
            echo "TARGET_PROJECT=prj-lbd-shared-np" >> $GITHUB_ENV
            echo "TARGET_BUCKET=bkt-clin-syn-configs-np" >> $GITHUB_ENV
            echo "TARGET_SA=project-service-account@prj-lbd-shared-np.iam.gserviceaccount.com" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------
      # 2. Authenticate via Workload Identity Federation
      # ---------------------------------------------------
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # ---------------------------------------------------
      # 3. Impersonate ENV-SPECIFIC project-service-account
      # ---------------------------------------------------
      - name: Impersonate Target Project SA
        run: |
          gcloud config set auth/impersonate_service_account "$TARGET_SA"

      # ---------------------------------------------------
      # 4. Sync ONLY changed ingestion configs to GCS
      # ---------------------------------------------------
      - name: Sync Ingestion Configs to GCS
        run: |
          echo "Syncing changed ingestion configs to bucket: gs://$TARGET_BUCKET/"

          if compgen -G "bigquery/clinical/synthea/bronze/ingestion_configs/*" > /dev/null; then
            # 'gcloud storage rsync' only copies files where checksums or sizes differ.
            gcloud storage rsync -r bigquery/clinical/synthea/bronze/ingestion_configs gs://$TARGET_BUCKET/clinical/synthea/bronze/ingestion_configs
          else
            echo "No ingestion configs found. Skipping."
          fi

          echo "✅ Sync complete."