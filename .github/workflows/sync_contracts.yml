name: Sync Data Contracts → GCS

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'bigquery/**/contracts/**'
      - 'bigquery/**/ingestion_configs/**'
      - '.github/workflows/sync_contracts.yml'

jobs:
  sync-contracts:
    runs-on: ubuntu-latest

    env:
      NP_BUCKET: bkt-clin-syn-configs-np
      PD_BUCKET: bkt-clin-syn-configs-pd

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Identify environment based on branch
      - name: Determine target bucket
        id: envcheck
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" == "dev" ]]; then
            echo "bucket=${NP_BUCKET}" >> $GITHUB_OUTPUT
            echo "env=np" >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == "main" ]]; then
            echo "bucket=${PD_BUCKET}" >> $GITHUB_OUTPUT
            echo "env=pd" >> $GITHUB_OUTPUT

          else
            echo "::warning::Branch $BRANCH does not require sync. Skipping."
            exit 0
          fi

      # Authenticate with WIF
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Perform sync
      - name: Sync contracts + configs to GCS
        run: |
          TARGET_BUCKET="${{ steps.envcheck.outputs.bucket }}"

          echo "Syncing to bucket: $TARGET_BUCKET"

          gsutil -m rsync -r \
            bigquery/clinical/synthea/bronze/contracts \
            gs://$TARGET_BUCKET/contracts

          gsutil -m rsync -r \
            bigquery/clinical/synthea/bronze/ingestion_configs \
            gs://$TARGET_BUCKET/ingestion_configs

          echo "Sync completed."
