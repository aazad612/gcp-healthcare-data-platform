name: 🏥 Synthea Multi-DDL Deployment

on:
  push:
    branches: [ dev, test, qa, main ]
    # Only trigger when THESE specific files change
    paths:
      - 'bigquery/clinical/synthea/bronze/tables/conditions.sql'
      - 'bigquery/clinical/synthea/bronze/tables/encounters.sql'
      - '.github/workflows/synthia_deploy_ddl_multi.yml'
      # - 'bigquery/scripts/validate_schema.py'

    # paths-ignore:
    #   - '**'

jobs:
  deploy_syn_ddl_multi:
    if: false
    runs-on: ubuntu-latest

    # 🔥 YOU CONTROL WHICH FILES ARE DEPLOYED HERE
    env:
      FILE_LIST: >
        bigquery/clinical/synthea/bronze/tables/conditions.sql,
        bigquery/clinical/synthea/bronze/tables/encounters.sql


    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Abort if no FILE_LIST
        run: |
          if [[ -z "${FILE_LIST// }" ]]; then
            echo "::warning::FILE_LIST is empty. Nothing to deploy."
            exit 0
          fi

      # ---------------- ENVIRONMENT DETECTION ----------------
      - name: Determine Target Environment Variables
        id: set_vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          case "$BRANCH_NAME" in
            dev)
              PROJECT_ID="prj-clin-syn-np"
              DATASET_ID="synthea_bronze_dev"
              ;;
            test)
              PROJECT_ID="prj-clin-syn-np-test"
              DATASET_ID="synthea_bronze_test"
              ;;
            qa)
              PROJECT_ID="prj-clin-syn-np-qa"
              DATASET_ID="synthea_bronze_qa"
              ;;
            main)
              PROJECT_ID="prj-clin-syn-pd"
              DATASET_ID="synthea_bronze"
              ;;
            *)
              echo "::error::Unknown branch environment: $BRANCH_NAME"
              exit 1
              ;;
          esac

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_OUTPUT

      # ---------------- AUTHENTICATION ----------------
      - name: Authenticate via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # ---------------- PYTHON SETUP ----------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install sqlglot google-cloud-bigquery google-auth

      # ---------------- PROCESS MULTIPLE FILES ----------------
      - name: Validate + Deploy All Files in FILE_LIST
        env:
          PROJECT_ID: ${{ steps.set_vars.outputs.PROJECT_ID }}
          DATASET_ID: ${{ steps.set_vars.outputs.DATASET_ID }}
        run: |
          echo "🚀 Deploying the following SQL files:"
          echo "${FILE_LIST}"

          # Normalize the list:
          # - Replace commas with spaces
          # - Trim quotes
          # - Remove empty entries
          NORMALIZED_LIST=$(echo "$FILE_LIST" \
              | tr ',' ' ' \
              | sed 's/"//g' \
              | xargs)

          # Now loop safely
          for SQL_FILE in $NORMALIZED_LIST; do
            if [[ -z "$SQL_FILE" ]]; then
              continue
            fi

            echo ""
            echo "=============================="
            echo " VALIDATING: $SQL_FILE"
            echo "=============================="

            python bigquery/scripts/validate_schema.py \
                --sql_file "$SQL_FILE" \
                --project "$PROJECT_ID" \
                --dataset "$DATASET_ID"

            echo ""
            echo "=============================="
            echo " DEPLOYING: $SQL_FILE"
            echo "=============================="

            TARGET_SA="project-service-account@$PROJECT_ID.iam.gserviceaccount.com"
            gcloud config set auth/impersonate_service_account "$TARGET_SA"

            bq --project_id="$PROJECT_ID" \
              --dataset_id="$DATASET_ID" \
              query --use_legacy_sql=false \
              < "$SQL_FILE"

            echo "✅ Successfully deployed: $SQL_FILE"
            echo ""
          done

          echo "🎉 All deployments complete."
