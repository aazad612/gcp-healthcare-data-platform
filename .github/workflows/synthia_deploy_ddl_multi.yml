#!/usr/bin/env python3
import argparse
import re
import sys
from google.cloud import bigquery
from google.cloud.exceptions import NotFound
import sqlglot
from google.auth import default
from google.auth.impersonated_credentials import ImpersonatedCredentials


# ==========================
# CONFIG
# ==========================
STANDARDS_PROJECT = "prj-lbd-shared-np"
STANDARDS_DATASET = "ops_metadata"
STANDARDS_TABLE = "standards_definition"
TARGET_STANDARD_ID = "BRONZE_V1"
TARGET_LAYER = "BRONZE"


# ==========================
# IMPERSONATED CLIENT
# ==========================
def get_impersonated_bq_client(target_sa, project_id):
    source_credentials, _ = default()

    impersonated_creds = ImpersonatedCredentials(
        source_credentials=source_credentials,
        target_principal=target_sa,
        target_scopes=["https://www.googleapis.com/auth/cloud-platform"],
        lifetime=300,
    )

    return bigquery.Client(credentials=impersonated_creds, project=project_id)


# ==========================
# NORMALIZE TYPES
# ==========================
def normalize_type(t):
    if not t:
        return None

    t = t.upper()

    if t in ("TIMESTAMPTZ", "TIMESTAMPZ"):
        return "TIMESTAMP"
    if t == "TEXT":
        return "STRING"
    if t in ("INT", "INTEGER"):
        return "INT64"
    if t == "DATETIME":
        return "TIMESTAMP"

    return t


# ==========================
# PREPROCESS SQL (remove {{ }}, backticks)
# ==========================
def preprocess_sql(sql):
    sql = re.sub(r"\{\{.*?\}\}", "TEMPLATE", sql)
    sql = re.sub(r"\$\{.*?\}", "TEMPLATE", sql)
    sql = re.sub(r"`([^`]*)`", lambda m: m.group(1).replace(".", "_"), sql)
    return sql


# ==========================
# PARSE SQL DDL
# ==========================
def parse_sql(sql_file):
    text = preprocess_sql(open(sql_file).read())

    try:
        parsed = sqlglot.parse_one(text, read="bigquery")
    except Exception as e:
        print(f"::error::Unable to parse DDL {sql_file}: {e}")
        sys.exit(1)

    cols = {}
    for c in parsed.find_all(sqlglot.exp.ColumnDef):
        col = c.name.lower()
        kind = c.args.get("kind")
        if kind:
            cols[col] = normalize_type(kind.sql())

    # Partition
    part_exprs = parsed.find_all(sqlglot.exp.Partition)
    partitions = set()
    for p in part_exprs:
        for ex in p.expressions:
            if hasattr(ex, "name"):
                partitions.add(ex.name.lower())
            elif hasattr(ex, "expressions"):
                inner = ex.expressions[0]
                if hasattr(inner, "name"):
                    partitions.add(inner.name.lower())

    # Cluster
    clust = parsed.find(sqlglot.exp.Cluster)
    clusters = set()
    if clust:
        clusters = {ex.name.lower() for ex in clust.expressions}

    return cols, partitions, clusters


# ==========================
# LOAD STANDARDS
# ==========================
def load_standards(bq):
    query = f"""
        SELECT column_name, expected_type, is_mandatory,
               is_partition_col, is_cluster_col
        FROM `{STANDARDS_PROJECT}.{STANDARDS_DATASET}.{STANDARDS_TABLE}`
        WHERE standard_id = '{TARGET_STANDARD_ID}'
          AND layer = '{TARGET_LAYER}'
    """

    rows = list(bq.query(query).result())
    if not rows:
        print("::error::No standards found.")
        sys.exit(1)

    required_cols = {}
    partitions = set()
    clusters = set()

    for r in rows:
        name = r.column_name.lower()
        required_cols[name] = r.expected_type.upper()
        if r.is_partition_col:
            partitions.add(name)
        if r.is_cluster_col:
            clusters.add(name)

    return required_cols, partitions, clusters


# ==========================
# VALIDATE SQL DDL
# ==========================
def validate(sql_file, bq_project):

    print(f"\nVALIDATING: {sql_file}")

    # Impersonated client hitting shared standards project
    target_sa = f"project-service-account@{bq_project}.iam.gserviceaccount.com"
    bq = get_impersonated_bq_client(target_sa, STANDARDS_PROJECT)

    ddl_cols, ddl_parts, ddl_clust = parse_sql(sql_file)
    req_cols, req_parts, req_clust = load_standards(bq)

    # Missing columns
    missing = [c for c in req_cols if c not in ddl_cols]
    if missing:
        print(f"::error::DDL missing columns: {missing}")
        sys.exit(1)

    # Type mismatches
    mismatches = []
    for c, exp in req_cols.items():
        if ddl_cols[c] != exp:
            mismatches.append(f"{c}: expected {exp}, found {ddl_cols[c]}")
    if mismatches:
        print("::error::Column type mismatches:\n" + "\n".join(mismatches))
        sys.exit(1)

    # Partition required
    if req_parts and not ddl_parts:
        print(f"::error::DDL missing PARTITION BY. Required: {req_parts}")
        sys.exit(1)

    if req_parts and not (ddl_parts & req_parts):
        print(f"::error::Incorrect partition. Required: {req_parts}, Found: {ddl_parts}")
        sys.exit(1)

    # Cluster required
    if req_clust and not req_clust.issubset(ddl_clust):
        print(f"::error::Missing cluster columns: {req_clust - ddl_clust}")
        sys.exit(1)

    print("DDL Validation Passed ✔")


# ==========================
# MAIN
# ==========================
if __name__ == "__main__":
    parser = argparse.ArgumentParser()
    parser.add_argument("--sql_file", required=True)
    parser.add_argument("--project", required=True)
    parser.add_argument("--dataset", required=True)
    args = parser.parse_args()

    validate(args.sql_file, args.project)
