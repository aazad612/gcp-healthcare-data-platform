name: 🏥 Synthea Multi-DDL Deployment

on:
  push:
    branches: [ dev, test, qa, main ]
    # Only trigger when THESE specific files change
    paths:
      - 'bigquery/clinical/synthea/bronze/tables/conditions.sql'
      - 'bigquery/clinical/synthea/bronze/tables/encounters.sql'
      - '.github/workflows/synthia_deploy_ddl_multi.yml'
      # - 'bigquery/scripts/validate_schema.py'

jobs:
  deploy-ddl:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      # ⭐ EDIT THIS LIST WHEN YOU WANT MORE TABLES
      SQL_FILES: |
        bigquery/clinical/synthea/bronze/tables/conditions.sql
        bigquery/clinical/synthea/bronze/tables/encounters.sql

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------
      # STEP 1 — Determine environment (dev/test/qa/prod)
      # -------------------------------------------
      - name: Determine Target Environment
        id: envset
        run: |
          BR="${{ github.ref_name }}"
          case "$BR" in
            dev)
              PROJECT_ID="prj-clin-syn-np"
              DATASET_ID="synthea_bronze_dev"
              ;;
            test)
              PROJECT_ID="prj-clin-syn-np-test"
              DATASET_ID="synthea_bronze_test"
              ;;
            qa)
              PROJECT_ID="prj-clin-syn-np-qa"
              DATASET_ID="synthea_bronze_qa"
              ;;
            main)
              PROJECT_ID="prj-clin-syn-pd"
              DATASET_ID="synthea_bronze"
              ;;
          esac

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_OUTPUT

      # -------------------------------------------
      # STEP 2 — Authenticate via WIF
      # -------------------------------------------
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}

      # -------------------------------------------
      # STEP 3 — Setup Python tools
      # -------------------------------------------
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install sqlglot google-cloud-bigquery google-auth google-auth-impersonated-credentials

      # -------------------------------------------
      # STEP 4 — Impersonate SA for VALIDATION
      # -------------------------------------------
      - name: Impersonate Service Account (Validation)
        env:
          TARGET_SA_EMAIL: project-service-account@${{ steps.envset.outputs.PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud config set auth/impersonate_service_account "$TARGET_SA_EMAIL"

      # -------------------------------------------
      # STEP 5 — VALIDATE EACH SQL FILE
      # -------------------------------------------
      - name: Validate DDLs
        run: |
          for FILE in ${{ env.SQL_FILES }}; do
            echo "Validating $FILE"
            python bigquery/scripts/validate_schema.py \
              --sql_file "$FILE" \
              --project "${{ steps.envset.outputs.PROJECT_ID }}" \
              --dataset "${{ steps.envset.outputs.DATASET_ID }}"
          done

      # -------------------------------------------
      # STEP 6 — Impersonate AGAIN for Deployment
      # -------------------------------------------
      - name: Impersonate Service Account (Deployment)
        env:
          TARGET_SA_EMAIL: project-service-account@${{ steps.envset.outputs.PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud config set auth/impersonate_service_account "$TARGET_SA_EMAIL"

      # -------------------------------------------
      # STEP 7 — DEPLOY THE SQL FILES
      # -------------------------------------------
      - name: Deploy SQL Files
        run: |
          PROJECT="${{ steps.envset.outputs.PROJECT_ID }}"
          for FILE in ${{ env.SQL_FILES }}; do
            echo "Deploying $FILE ..."
            bq --project_id="$PROJECT" query --use_legacy_sql=false < "$FILE"
          done
          echo "Deployment complete."
