name: Multi-Env SQL Deployment

on:
  push:
    branches: [ dev, main ]
    paths:
      - "bigquery/ops/tables/**"
      - ".github/workflows/ops_deploy_sql.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    # --------------------------
    #  FILE LIST (GLOBAL)
    # --------------------------
    env:
      FILE_LIST: >
        bigquery/ops/tables/file_ingestion_audit.sql,
        bigquery/ops/tables/standards_definition.sql


    # --------------------------
    # MATRIX CONFIG
    # --------------------------
    strategy:
      matrix:
        env: [dev, prod]
        include:
          - env: dev
            PROJECT_ID: prj-clin-syn-np
            TARGET_SA: project-service-account@prj-clin-syn-np.iam.gserviceaccount.com
            DATASET_ID: synthea_bronze_dev

          - env: prod
            PROJECT_ID: prj-clin-syn-pd
            TARGET_SA: project-service-account@prj-clin-syn-pd.iam.gserviceaccount.com
            DATASET_ID: synthea_bronze

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Authenticate via WIF
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install sqlglot google-cloud-bigquery google-auth

      # --------------------------
      # DEPLOYMENT LOGIC
      # --------------------------
      - name: Validate + Deploy SQL
        env:
          PROJECT_ID: ${{ matrix.PROJECT_ID }}
          TARGET_SA: ${{ matrix.TARGET_SA }}
          DATASET_ID: ${{ matrix.DATASET_ID }}
        run: |
          echo "====== Deploying ENV: ${{ matrix.env }} ======"
          echo "Project       : $PROJECT_ID"
          echo "Target SA     : $TARGET_SA"
          echo "Dataset       : $DATASET_ID"
          echo "File List     : $FILE_LIST"

          # Normalize comma-separated list into clean loopable items
          NORMALIZED_LIST=$(echo "$FILE_LIST" \
              | tr ',' ' ' \
              | xargs)

          # Loop through files
          for SQL_FILE in $NORMALIZED_LIST; do
            echo ""
            echo "=== VALIDATING: $SQL_FILE ==="

            TEMP_SQL=$(mktemp)

            sed \
              -e "s|\${PROJECT_ID}|$PROJECT_ID|g" \
              -e "s|\${DATASET_ID}|$DATASET_ID|g" \
              "$SQL_FILE" > "$TEMP_SQL"

            # Now deploy the substituted SQL
            bq query \
              --use_legacy_sql=false \
              --project_id="$PROJECT_ID" \
              < "$TEMP_SQL"


            echo "✔ Completed: $SQL_FILE"
          done

          echo "🎉 Deployment Complete for ${{ matrix.env }}"
