name: Multi-Env OPS SQL Deployment

on:
  push:
    branches: [ dev, main ]
    paths:
      - "bigquery/ops/tables/**"
      - "bigquery/ops/seeds/**"
      - ".github/workflows/ops_deploy_sql.yml"

# ---------------------------------------------------------
# GLOBAL VARS (Shared file list)
# ---------------------------------------------------------
env:
  FILE_LIST: >
    bigquery/ops/seeds/file_ingestion_mapping_conditions.sql

jobs:
  deploy_ops_sql:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # AUTHENTICATE WIF (Ambient Identity)
      # -----------------------------------------------------
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # -----------------------------------------------------
      # DETERMINE DEV vs PROD TARGETS
      # -----------------------------------------------------
      - name: Set Deployment Environment Vars
        id: set_vars
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "dev" ]]; then
            echo "TARGET_PROJECT_ID=prj-lbd-shared-np" >> $GITHUB_OUTPUT
            echo "TARGET_SA_EMAIL=project-service-account@prj-lbd-shared-np.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
            echo "DATASET_ID=ops_metadata" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=dev" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "main" ]]; then
            echo "TARGET_PROJECT_ID=prj-lbd-shared-pd" >> $GITHUB_OUTPUT
            echo "TARGET_SA_EMAIL=project-service-account@prj-lbd-shared-pd.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
            echo "DATASET_ID=ops_metadata" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=prod" >> $GITHUB_OUTPUT
          else
            echo "::error::Branch '$BRANCH' is not mapped to a deploy environment."
            exit 1
          fi
      

      # -----------------------------------------------------
      # PYTHON FOR SQL VALIDATOR
      # -----------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install sqlglot google-cloud-bigquery google-auth

      # -----------------------------------------------------
      # VALIDATE + DEPLOY SQL
      # -----------------------------------------------------
      - name: Validate + Deploy SQL Files
        env:
          TARGET_PROJECT_ID: ${{ steps.set_vars.outputs.TARGET_PROJECT_ID }}
          TARGET_SA_EMAIL: ${{ steps.set_vars.outputs.TARGET_SA_EMAIL }}
          DATASET_ID: ${{ steps.set_vars.outputs.DATASET_ID }}
          DEPLOY_ENV: ${{ steps.set_vars.outputs.DEPLOY_ENV }}
        run: |
          echo "====================================================="
          echo "🚀 Deploying OPS SQL to ENV: $DEPLOY_ENV"
          echo "Project: $TARGET_PROJECT_ID"
          echo "Target SA: $TARGET_SA_EMAIL"
          echo "Dataset: $DATASET_ID"
          echo "====================================================="

          # Convert CSV → space-separated list
          NORMALIZED_LIST=$(echo "$FILE_LIST" \
              | tr ',' ' ' \
              | sed 's/"//g' \
              | xargs)


          for SQL_FILE in $NORMALIZED_LIST; do

            if [[ -z "$SQL_FILE" ]]; then
              continue
            fi

            echo ""
            echo "======================================"
            echo " DEPLOYING: $SQL_FILE"
            echo "======================================"

            TEMP_SQL=$(mktemp)

            sed -E \
              -e "s/\{\{\s*PROJECT_ID\s*\}\}/$TARGET_PROJECT_ID/g" \
              -e "s/\{\{\s*DATASET_ID\s*\}\}/$DATASET_ID/g" \
              "$SQL_FILE" > "$TEMP_SQL"


            # Impersonate for THIS query only (correct way!)
            gcloud config set auth/impersonate_service_account "$TARGET_SA_EMAIL"

            bq --project_id="$TARGET_PROJECT_ID" \
               --dataset_id="$DATASET_ID" \
               query --use_legacy_sql=false \
               < "$TEMP_SQL"

            echo "✔ SUCCESS: $SQL_FILE"
            echo ""
          done

          echo "🎉 OPS SQL Deployment Complete for env: $DEPLOY_ENV"
