        qa:  "https://www.googleapis.com/compute/v1/projects/prj-net-common-np-host/regions/us-central1/subnetworks/sb-hub-enterprise-usc1"
        uat: "https://www.googleapis.com/compute/v1/projects/prj-net-common-np-host/regions/us-central1/subnetworks/sb-hub-enterprise-usc1"
        prod: "https://www.googleapis.com/compute/v1/projects/prj-net-common-pd-host/regions/us-central1/subnetworks/sb-hub-enterprise-usc1"

    units:
      something1:
        project:
          dev: "prj-ent-s1-np"
          qa:  "prj-ent-s1-qa"
          uat: "prj-ent-s1-uat"
          prod: "prj-ent-s1-pd"
        sa:
          dev: "project-service-account@prj-ent-s1-np.iam.gserviceaccount.com"
          qa:  "project-service-account@prj-ent-s1-qa.iam.gserviceaccount.com"
          uat: "project-service-account@prj-ent-s1-uat.iam.gserviceaccount.com"
          prod: "project-service-account@prj-ent-s1-pd.iam.gserviceaccount.com"
        dataset:
          dev: "s1_bronze_dev"
          qa:  "s1_bronze_qa"
          uat: "s1_bronze_uat"
          prod: "s1_bronze_prod"
        config_bucket:
          dev: "bkt-ent-s1-configs-np"
          qa:  "bkt-ent-s1-configs-qa"
          uat: "bkt-ent-s1-configs-uat"
          prod: "bkt-ent-s1-configs-pd"
        landing_bucket:
